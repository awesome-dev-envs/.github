name: Change Request
description: Is something bothering you? Suggest a change.
title: "[change]"
labels:
  - enhancement
  - triage

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve this project!

        Before submitting a change request, take a moment to read our [Contributing Guide](https://github.com/awesome-dev-envs/.github/blob/main/CONTRIBUTING.md).  
        If you have questions, need support, or would like to suggest a new feature, please use our [GitHub Discussions](https://github.com/orgs/awesome-dev-envs/discussions).

        Use Discussions for questions. File this issue in the stack repo when the change is in an installer.

        Keep your description specific and concise.

  - type: textarea
    id: behavior
    attributes:
      label: Current Behavior
      description: Describe how the feature works today.
      placeholder: How this feature works today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Change Proposal
      description: Describe what should be changed.
      placeholder: |
        ### Proposed change:
        What should be changed?

        ### New behavior:
        How should the feature behave after the change?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Explain why this change is needed or how this change would improve the project.
      placeholder: Why this change is needed?
    validations:
      required: true