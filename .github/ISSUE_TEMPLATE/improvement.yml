name: Improvement
description: Docs, templates, skill, UX, or i18n improvement
title: "[improvement] "
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Organization docs
        - Installer UX / prompts
        - i18n
        - Skill or authoring templates
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change and why. Keep it specific.
    validations:
      required: true
